services:
  jenkins:
    build:
      context: ./jenkins
    ports:
      - "8081:8080"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-changeme}
      - HOST_JENKINS_HOME=${PWD}/jenkins_home
